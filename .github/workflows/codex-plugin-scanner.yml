name: Codex Plugin Scanner CI

on:
  push:
    branches: [main]
    paths:
      - '.codex-plugin/**'
      - '.agents/**'
      - '.codex/agents/**'
      - 'hooks/**'
      - '.mcp.json'
  pull_request:
    branches: [main]
    paths:
      - '.codex-plugin/**'
      - '.agents/**'
      - '.codex/agents/**'
      - 'hooks/**'
      - '.mcp.json'

permissions:
  contents: read

concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Plugin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Run scanner
        # 上游 hashgraph-online/codex-plugin-scanner 迁库后暂无可用 action;
        # 用仓库内建校验覆盖 manifest schema、skills frontmatter 与 hooks 约定,
        # 上游恢复后可切回。
        run: node scripts/check-codex-surface.mjs
