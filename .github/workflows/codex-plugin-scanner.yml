name: Codex Plugin Scanner CI

on:
  push:
    branches: [main]
    paths:
      - '.codex-plugin/**'
      - '.agents/**'
      - '.codex/agents/**'
      - 'hooks/**'
      - '.mcp.json'
  pull_request:
    branches: [main]
    paths:
      - '.codex-plugin/**'
      - '.agents/**'
      - '.codex/agents/**'
      - 'hooks/**'
      - '.mcp.json'

permissions:
  contents: read

concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Plugin Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Run scanner
        uses: hashgraph-online/codex-plugin-scanner@9533a3340c1e5ea3a3f802d584ec94d9f8580de1
        with:
          args: scan --fail-on critical
